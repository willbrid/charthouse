# CI test values for the netshoot chart — Deployment scenario.
# Used by chart-testing (ct) to validate the default shape of the chart: a couple of
# interchangeable debug pods kept alive by the sleep loop, with the environment
# variables coming from both a ConfigMap and a Secret.

kind: Deployment

replicaCount: 2

deployment:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

image:
  repository: nicolaka/netshoot
  pullPolicy: IfNotPresent
  tag: "v0.16"

# The default command, spelled out here so a change to it fails this scenario rather
# than passing unnoticed: without it the container exits as soon as it starts, and
# the release never becomes ready.
command:
  - "sh"
  - "-c"
  - "while true; do sleep 5; done"

# Non-sensitive variables, rendered into the ConfigMap <fullname> and pulled in with
# envFrom.
configmap:
  TARGET_HOST: "kubernetes.default.svc.cluster.local"
  TARGET_PORT: "443"

# Sensitive variables, rendered into the Secret <fullname>. Nothing real here: the
# scenario only checks the Secret is created and referenced.
secret:
  API_TOKEN: "chart-testing"

# Downward API, which the two maps above cannot express.
env:
  - name: NODE_NAME
    valueFrom:
      fieldRef:
        fieldPath: spec.nodeName
  - name: POD_IP
    valueFrom:
      fieldRef:
        fieldPath: status.podIP

# Default security context, spelled out: capabilities dropped, NET_RAW and NET_ADMIN
# added back so the toolbox stays usable, no privilege escalation.
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_RAW
      - NET_ADMIN
  allowPrivilegeEscalation: false

podSecurityContext:
  fsGroup: 1000

# An ephemeral scratch volume, the plain volumes/volumeMounts path that every kind
# supports.
volumes:
  - name: scratch
    emptyDir: {}

volumeMounts:
  - name: scratch
    mountPath: /scratch

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi
