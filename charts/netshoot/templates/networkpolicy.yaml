{{- if .Values.networkPolicy.enabled -}}
{{- include "netshoot.validateNetworkPolicy" . -}}
{{- $policy := .Values.networkPolicy -}}
{{- $types := include "netshoot.networkPolicyTypes" . | fromYamlArray -}}
{{- /*
NetworkPolicy selecting the netshoot pods. It is enforced by the CNI, not by
Kubernetes itself: under a plugin that ignores NetworkPolicies (the kindnet of a
default Kind cluster, for instance) this object exists and restricts nothing.
An empty rule list on a declared policy type denies that direction entirely, which
is the whole point of `enabled: true` with nothing else set.
*/}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "netshoot.fullname" . }}
  labels:
    {{- include "netshoot.labels" . | nindent 4 }}
    {{- with $policy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $policy.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "netshoot.selectorLabels" . | nindent 6 }}
  policyTypes:
    {{- toYaml $types | nindent 4 }}
  {{- if has "Ingress" $types }}
  {{- with $policy.ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- else }}
  {{- /* No rule on a governed direction: nothing gets in. */}}
  ingress: []
  {{- end }}
  {{- end }}
  {{- if has "Egress" $types }}
  {{- if and (not $policy.allowDNS) (not $policy.egress) }}
  {{- /* No rule on a governed direction: nothing gets out, DNS included. */}}
  egress: []
  {{- else }}
  egress:
    {{- if $policy.allowDNS }}
    {{- /*
    Name resolution is the first thing a network toolbox does, and an egress policy
    without this rule breaks it — including for the tools meant to diagnose the
    problem. The selector targets the cluster DNS service, CoreDNS by default.
    */}}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $policy.dns.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $policy.dns.podSelector | nindent 14 }}
      ports:
        {{- toYaml $policy.dns.ports | nindent 8 }}
    {{- end }}
    {{- with $policy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
