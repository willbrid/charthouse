{{- if .Values.service.enabled -}}
{{- include "netshoot.validateServicePorts" . -}}
{{- /*
Optional service, off by default: netshoot is a client toolbox reached with
`kubectl exec`, not a server. Turn it on to publish a listener started inside the
pod — an iperf3 server, `nc -l`, a python http.server.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "netshoot.fullname" . }}
  labels:
    {{- include "netshoot.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .name }}
      protocol: {{ .protocol | default "TCP" }}
      {{- if and .nodePort (or (eq $.Values.service.type "NodePort") (eq $.Values.service.type "LoadBalancer")) }}
      nodePort: {{ .nodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "netshoot.selectorLabels" . | nindent 4 }}
{{- end }}
