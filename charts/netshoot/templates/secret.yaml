{{- if .Values.secret }}
{{- /*
Sensitive environment variables of the netshoot container, referenced by the pod
template with `envFrom`. Created only when `.Values.secret` holds something.
Values are base64-encoded, which is encoding and not encryption: anybody allowed to
read the Secret — or to exec into the pod — reads them back.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netshoot.fullname" . }}
  labels:
    {{- include "netshoot.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | toString | b64enc }}
{{- end }}
{{- end }}
