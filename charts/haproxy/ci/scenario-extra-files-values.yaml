# CI test values for the haproxy chart — configuration split across several files.
# Used by chart-testing (ct) to validate what a real HAProxy configuration needs
# beyond a single file: a map file driving the backend selection, a custom error
# page, and a configMountPath that does not hide the `errors/` directory the image
# ships — mounting a ConfigMap over /usr/local/etc/haproxy would shadow it, so the
# configuration goes one level down and `command` follows.
# It also covers the objects that surround a proxy in production: an HPA owning the
# replica count and a PodDisruptionBudget bounding what a node drain may take.

kind: Deployment

# Ignored while autoscaling is on: the chart leaves `replicas` out of the Deployment
# so the HPA owns it. Declared here so the run proves it is left out.
replicaCount: 2

image:
  repository: haproxy
  pullPolicy: IfNotPresent
  tag: "3.4"

# One level below the directory the image populates, so /usr/local/etc/haproxy/errors
# stays visible and the default error pages remain usable.
configMountPath: /usr/local/etc/haproxy/conf
configFileName: haproxy.cfg

# The command follows configMountPath. The chart fails at render time when the two
# disagree, which is the mistake this scenario is shaped around.
command:
  - "haproxy"
  - "-W"
  - "-db"
  - "-f"
  - "/usr/local/etc/haproxy/conf/haproxy.cfg"

configCheck:
  enabled: true
  command:
    - "haproxy"
    - "-c"
    - "-f"
    - "/usr/local/etc/haproxy/conf/haproxy.cfg"

# `map()` reads the file rendered by `extraFiles` in the same directory; the 503 page
# is the one rendered next to it, and the 502 page comes from the image, which is
# only possible because the mount does not shadow it.
config: |
  global
      log stdout format raw local0 info
      maxconn 4096

  defaults
      log     global
      mode    http
      option  httplog
      option  dontlognull
      retries 3
      timeout connect 5s
      timeout client  50s
      timeout server  50s
      errorfile 503 /usr/local/etc/haproxy/conf/503.http
      errorfile 502 /usr/local/etc/haproxy/errors/502.http

  frontend health
      bind *:8404
      mode http
      http-request set-log-level silent
      monitor-uri /healthz
      http-request use-service prometheus-exporter if { path /metrics }
      stats enable
      stats uri /stats

  frontend http_in
      bind *:8080
      mode http
      # Host header to backend name, defaulting to `app` when the map has no entry.
      use_backend %[req.hdr(host),lower,word(1,:),map(/usr/local/etc/haproxy/conf/hosts.map,app)]

  backend app
      mode http
      option httpchk GET /healthz
      server local 127.0.0.1:8404 check

  backend maintenance
      mode http
      http-request deny deny_status 503

# Rendered as additional keys of the same ConfigMap, so they land next to the
# configuration in configMountPath.
extraFiles:
  hosts.map: |
    # <host> <backend>
    app.example.com           app
    maintenance.example.com   maintenance
  503.http: |
    HTTP/1.1 503 Service Unavailable
    Cache-Control: no-cache
    Connection: close
    Content-Type: text/plain

    Backend unavailable — served by {{ .Release.Name }} in {{ .Release.Namespace }}.

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 99
  runAsGroup: 99
  seccompProfile:
    type: RuntimeDefault

securityContext:
  capabilities:
    drop:
      - ALL
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

service:
  enabled: true
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: health
      port: 8404
      targetPort: 8404
      protocol: TCP

# The HPA takes the replica count over. Without a metrics server in the test cluster
# it computes nothing and scales nothing; what the run covers is that the object is
# valid, targets the right kind, and that the Deployment stops carrying `replicas`.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    # ScheduleAnyway, not DoNotSchedule: a single-node Kind cluster has nowhere to
    # spread to, and the pods must still be schedulable.
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: haproxy

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
