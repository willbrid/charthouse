{{- if .Values.secret }}
{{- /*
Sensitive environment variables of the haproxy container, referenced by the pod
template with `envFrom` and expanded as ${VAR} by HAProxy when it reads its
configuration — a `stats auth` password, a token sent to a backend, a peers secret.
Created only when `.Values.secret` holds something.
Values are base64-encoded, which is encoding and not encryption: anybody allowed to
read the Secret reads them back.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "haproxy.fullname" . }}
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
type: Opaque
data:
{{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | toString | b64enc }}
{{- end }}
{{- end }}
