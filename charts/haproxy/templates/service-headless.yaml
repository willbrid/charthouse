{{- if eq (include "haproxy.kind" .) "StatefulSet" -}}
{{- include "haproxy.validateServicePorts" . -}}
{{- /*
Headless service required by the StatefulSet to give each pod a stable DNS name
(<fullname>-<ordinal>.<fullname>-headless.<namespace>.svc.cluster.local). It is
created for that kind alone, independently of `service.enabled`, and does not
replace the regular service, which load-balances across the pods.
Predictable names are what a StatefulSet of proxies is for: a peers section
addressing `haproxy-0.haproxy-headless` always reaches the same instance and its
stick tables, and a client that must stay on one proxy can target it by name.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "haproxy.headlessServiceName" . }}
  labels:
    {{- include "haproxy.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Pods are addressable as soon as they exist, which keeps the per-pod DNS names
  # usable while a pod is still starting up — peers need to find each other before
  # any of them is ready.
  publishNotReadyAddresses: true
  {{- with .Values.service.ports }}
  ports:
    {{- range . }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  {{- end }}
  selector:
    {{- include "haproxy.selectorLabels" . | nindent 4 }}
{{- end }}
