# Default values for grafana.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: grafana/grafana
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: "grafana"
fullnameOverride: "grafana"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 3000
  portname: http

# Sensitive Grafana environment variables injected into the pod via a Kubernetes Secret.
# Each key-value pair is automatically base64-encoded and exposed as an env var inside the container.
# Use this section for credentials and other confidential configuration (admin account,
# datasource passwords, SMTP credentials, etc.).
# Full list of supported GF_* variables: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
secret: {}
  #  GF_SECURITY_ADMIN_USER: admin
  #  GF_SECURITY_ADMIN_PASSWORD: test@test

# Non-sensitive Grafana environment variables injected into the pod via a Kubernetes ConfigMap.
# Each key-value pair is stored in plain text and exposed as an env var inside the container.
# Use this section for server settings, plugin lists, feature toggles, and other non-confidential
# configuration that can safely be stored unencrypted.
# Full list of supported GF_* variables: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/
configmap: {}
  #  GF_SERVER_ROOT_URL: "https://grafana.example.com"
  #  GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource,yesoreyeram-infinity-datasource"

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # List of rules and filters applied.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

# Configures a PersistentVolumeClaim (PVC) to provide durable storage for Grafana data
# (dashboards, plugins, SQLite database). Enabling persistence ensures data survives
# pod restarts and rescheduling. When disabled, Grafana uses ephemeral storage (emptyDir).
# More information: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
persistence:
  # Set to true to create a PersistentVolumeClaim for Grafana data storage.
  enabled: false
  # Storage class name for the PVC. Leave empty ("") to use the cluster's default StorageClass.
  storageClassName: ""
  # Access modes for the PVC. ReadWriteOnce is suitable for single-node or single-pod setups.
  # Use ReadWriteMany only if the StorageClass supports it and multiple replicas are required.
  # More information: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
  accessModes:
    - ReadWriteOnce
  # Requested storage capacity for the PVC.
  size: 10Gi
  # Example of a fully configured PVC (enable persistence and set storageClassName):
  # enabled: true
  # storageClassName: "standard"
  # accessModes:
  #   - ReadWriteOnce
  # size: 10Gi

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
livenessProbe: {}
  # tcpSocket:
  #  port: http
readinessProbe: {}
  # httpGet:
  #  path: /robots.txt
  #  port: http

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
# More information: https://kubernetes.io/docs/concepts/storage/volumes/
volumes: []
  # Example: mount Grafana persistent storage from the PVC created by this chart.
  # Requires persistence.enabled: true. The claimName must match the name produced
  # by the grafana.fullname helper (defaults to the fullnameOverride value, e.g. "grafana").
  # - name: grafana-storage
  #   persistentVolumeClaim:
  #     claimName: grafana

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: grafana-storage
  #   mountPath: "/var/lib/grafana"
  #   readOnly: false

nodeSelector: {}

tolerations: []

affinity: {}
