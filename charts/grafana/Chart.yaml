apiVersion: v2
name: grafana
description: A Helm chart for installing grafana in Kubernetes
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.1

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
# It is recommended to use it with quotes.
appVersion: "latest"

# Chart maintainers — required by chart-testing (ct lint) conventions.
maintainers:
  - name: willbrid
    email: ngaswilly77@gmail.com

annotations:
  # Publication switch read by the release pipeline: "false" keeps the chart out of the
  # packaging and of the push to GHCR while it is under development, without preventing
  # the lint and install test suite from running. This chart is published, so it is "true".
  charthouse.io/release: "true"
