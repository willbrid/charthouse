{{- if eq (include "fluentbit.kind" .) "DaemonSet" -}}
{{- include "fluentbit.validateServicePorts" . -}}
{{- $daemonSet := .Values.daemonSet | default dict -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "fluentbit.fullname" . }}
  labels:
    {{- include "fluentbit.labels" . | nindent 4 }}
spec:
  {{- /* No replicas and no autoscaling here: the node count drives the pod count. */}}
  {{- with $daemonSet.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "fluentbit.selectorLabels" . | nindent 6 }}
  template:
    {{- include "fluentbit.podTemplate" . | nindent 4 }}
{{- end }}
