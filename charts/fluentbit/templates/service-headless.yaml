{{- if eq (include "fluentbit.kind" .) "StatefulSet" -}}
{{- include "fluentbit.validateServicePorts" . -}}
{{- /*
Headless service required by the StatefulSet to give each pod a stable DNS name
(<statefulset>-<ordinal>.<fullname>-headless.<namespace>.svc). It is created only
for that kind, and does not replace the regular service, which keeps load-balancing
across the pods.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "fluentbit.fullname" . }}-headless
  labels:
    {{- include "fluentbit.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Pods are addressable as soon as they exist, which is what makes the per-pod
  # DNS names usable while a pod is still starting up.
  publishNotReadyAddresses: true
  ports:
    {{- range .Values.service.ports }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort | default .name }}
      protocol: {{ .protocol | default "TCP" }}
    {{- end }}
  selector:
    {{- include "fluentbit.selectorLabels" . | nindent 4 }}
{{- end }}
