apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "fluentbit.fullname" . }}-test-connection"
  labels:
    {{- include "fluentbit.testLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      {{- /* The health port is targeted when declared, the first service port otherwise. */}}
      args: ['{{ include "fluentbit.fullname" . }}:{{ include "fluentbit.servicePortNumber" (dict "ctx" . "port" "health" "optional" true) }}']
  restartPolicy: Never
