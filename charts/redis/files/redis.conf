# =============================================================================
# Redis OSS — base configuration, common to both modes
# =============================================================================
#
# This file is the chart's baseline. It is deliberately a real file rather than
# a block of values: a production redis.conf is long, ordering matters inside it
# and it is meant to be read and reviewed as a whole. It is loaded through
# .Files.Get and rendered with `tpl`, so Helm template expressions are allowed
# here — {{ .Release.Name }} and friends resolve.
#
# It is one of four pieces the chart assembles, in this order:
#
#   1. this file                      config.file
#   2. the mode fragment              config.modeFile   (cluster or sentinel)
#   3. your overrides                 config.overrides / config.extraConfig
#   4. the directives the chart owns  generated at pod startup
#
# Redis keeps the LAST occurrence of a directive, so every step overrides the
# one before it. Step 4 always wins — see the chart README for the short list of
# directives it owns and why they cannot be yours (data directory, announced
# addresses, replication source, password).
#
# Reference: https://redis.io/docs/latest/operate/oss_and_stack/
#            https://hub.docker.com/_/redis
# =============================================================================

# -----------------------------------------------------------------------------
# NETWORK
# -----------------------------------------------------------------------------

# Every interface, IPv4 and IPv6. A pod has its own network namespace, so this
# is not the exposure it would be on a shared host: what reaches the port is
# what Kubernetes routed there. Restrict it with a NetworkPolicy, not with bind.
bind * -::*

# Follows from the above. Left on, Redis would refuse every non-loopback client
# as soon as no password is set, which is exactly the CI and cache case.
protected-mode no

# The port is set by the chart from service.port, so that the container port,
# the service and the config can never disagree.

# Backlog of the accept queue. Raising it past the host's somaxconn silently
# truncates it — 511 is safe on any node.
tcp-backlog 511

# Never close an idle client. Connection pools are long lived and mostly idle.
timeout 0

# Keepalive probes, in seconds. Without them a connection cut by a NAT or a
# node reboot is only noticed on the next write, which for a replica can be a
# long time.
tcp-keepalive 300

# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------

# The container IS the daemon. Forking would put the pod's main process out of
# the way of the kubelet, which then supervises a process that has already
# exited.
daemonize no
supervised no

# Empty means stdout, which is where kubectl logs reads from.
logfile ""
loglevel notice

# Kept for the sentinel mode only. Redis Cluster supports database 0 alone and
# the chart's cluster fragment sets this back to 1.
databases 16

always-show-logo no

# Keep the crash and shutdown reports: they are the only trace left of a pod
# that was OOM-killed or evicted.
set-proc-title yes
crash-log-enabled yes

# -----------------------------------------------------------------------------
# SNAPSHOTTING (RDB)
# -----------------------------------------------------------------------------
#
# RDB is what a backup copies — see the backup section of the chart README. The
# thresholds below are the Redis defaults: one hour with a single change, five
# minutes with a hundred, one minute with ten thousand.
save 3600 1 300 100 60 10000

# Stop accepting writes when the background save fails. Harsh, and deliberately
# so: silently accepting writes that no longer reach the disk is worse.
stop-writes-on-bgsave-error yes

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# Keep the RDB produced by a diskless replication. It costs one file and saves
# a full resync when the replica restarts shortly after.
rdb-del-sync-files no

# The working directory is set by the chart to the volume mount path, so that
# the RDB, the AOF and the cluster node table land on the PersistentVolume.

# -----------------------------------------------------------------------------
# APPEND ONLY FILE (AOF)
# -----------------------------------------------------------------------------
#
# On by default in this chart, unlike upstream Redis. A pod is restarted far
# more casually than a server is rebooted — a node drain, an eviction, a rolling
# update — and RDB alone loses everything written since the last snapshot.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"

# One fsync per second. `always` costs a syscall per write and is rarely worth
# it on network storage; `no` leaves the flush to the kernel and loses far more.
appendfsync everysec

# Keep fsyncing during a rewrite. The alternative trades a latency spike for a
# window where writes are not on disk.
no-appendfsync-on-rewrite no

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Load a truncated AOF instead of refusing to start. A truncated tail is the
# normal state after a hard pod kill; refusing to start turns a few lost writes
# into an outage.
aof-load-truncated yes

# RDB-format preamble in the AOF: much faster to load and much smaller.
aof-use-rdb-preamble yes
aof-timestamp-enabled no

# -----------------------------------------------------------------------------
# REPLICATION
# -----------------------------------------------------------------------------
#
# `replicaof` is never set here. Which node replicates which is a runtime
# decision — sentinel makes it, the chart applies it at startup.

# Keep serving reads while the link to the master is down. The alternative
# returns an error to every client of every replica during a failover.
replica-serve-stale-data yes

# A replica accepts no writes. Sentinel promotes a replica by turning this off
# itself; Redis Cluster does the same. Setting it to `no` by hand is how two
# nodes end up both accepting writes.
replica-read-only yes

# Stream the RDB straight to the socket instead of writing it out first. On
# network storage the temporary file is the slowest part of a full resync.
repl-diskless-sync yes
repl-diskless-sync-delay 5

# The replica side of the same idea is left off: `swapdb` and `on-empty-db`
# trade memory or safety for speed, and a replica that fails to load a diskless
# RDB has nothing to fall back on.
repl-diskless-load disabled

repl-disable-tcp-nodelay no

# Deliberately far above the 1mb default. The backlog is what lets a replica
# reconnect with a partial resync instead of a full one, and the window it
# covers is the whole point: a rolling update restarts every replica in turn,
# and a full resync of each is a burst of CPU, disk and network on the master
# at the worst possible moment.
repl-backlog-size 64mb
repl-backlog-ttl 3600

# Lower wins the sentinel election. Left equal on purpose — the chart gives no
# pod a structural advantage; a pod is not a machine and none of them is better
# placed than the others.
replica-priority 100

# Refuse writes when fewer than N replicas are connected and lagging under M
# seconds. Off by default because it turns a replica outage into a master
# outage; a good idea when losing an acknowledged write is worse than refusing
# it, which is the case for most things worth storing in a database.
# min-replicas-to-write 1
# min-replicas-max-lag 10

# -----------------------------------------------------------------------------
# MEMORY MANAGEMENT
# -----------------------------------------------------------------------------
#
# maxmemory is not set here. Set it in values.yaml, at roughly 75% of
# resources.limits.memory, and never leave it unset when a limit is in place:
# Redis would happily grow into the limit and be OOM-killed by the kernel, which
# no eviction policy can protect against.

# Refuse writes rather than evict. The safe default for a data store; a pure
# cache wants allkeys-lru, and should say so in values.yaml.
maxmemory-policy noeviction
maxmemory-samples 5

# Freeing a large object blocks the server for as long as it takes. Doing it in
# a background thread is what keeps a DEL of a million-element hash from showing
# up as a latency spike on every other client.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
lazyfree-lazy-user-del yes
lazyfree-lazy-user-flush yes

# Same reasoning, applied to the replica side of a full resync: flushing the old
# dataset asynchronously keeps the replica answering during the swap.
replica-lazy-flush yes

# -----------------------------------------------------------------------------
# THREADED I/O
# -----------------------------------------------------------------------------
#
# Command execution stays single threaded; this only moves the reading and
# writing of sockets off the main thread. Worth setting to 2-4 when the CPU
# limit allows it and the workload is many small commands. Never set it above
# the CPU limit: the threads then fight each other for the same quota.
# io-threads 4

# -----------------------------------------------------------------------------
# CLIENTS
# -----------------------------------------------------------------------------
maxclients 10000

# Output buffer limits: hard, soft, soft seconds.
#
# The replica line is raised well above the 256mb/64mb default. A replica that
# hits it is disconnected mid-resync, retries, hits it again, and never catches
# up — the classic replication loop, and one that only shows up under exactly
# the write rate you have in production. Room is cheaper than that.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 512mb 128mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# -----------------------------------------------------------------------------
# OBSERVABILITY
# -----------------------------------------------------------------------------

# Commands slower than 10ms, last 128 of them: SLOWLOG GET.
slowlog-log-slower-than 10000
slowlog-max-len 128

# Event latency above 100ms: LATENCY LATEST, LATENCY DOCTOR.
latency-monitor-threshold 100

# Per-command latency percentiles: INFO latencystats.
latency-tracking yes

# Keyspace notifications are off: they cost on every write and few workloads
# consume them. "KEA" turns everything on.
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# ADVANCED — ENCODINGS
# -----------------------------------------------------------------------------
#
# Small collections are stored as flat, compact structures until they outgrow
# these thresholds. Raising them saves memory and costs CPU; the defaults are a
# reasonable trade and are rarely the thing worth tuning first.
hash-max-listpack-entries 128
hash-max-listpack-value 64
list-max-listpack-size 128
list-compress-depth 0
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000

# Rehash the main hash table in the background, at the cost of some CPU. Off, it
# saves that CPU and lets the table stay oversized for as long as it takes.
activerehashing yes

# Actively reclaim fragmented memory. Off by default because it is not free;
# turn it on when INFO memory shows mem_fragmentation_ratio staying above 1.5.
activedefrag no

# -----------------------------------------------------------------------------
# ADVANCED — BACKGROUND WORK
# -----------------------------------------------------------------------------

# Background task frequency, adapted to the number of connected clients.
hz 10
dynamic-hz yes

# Fsync in 32MB chunks while rewriting, so the final fsync is not one huge
# blocking write.
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# Let jemalloc release freed pages from a background thread rather than from the
# thread that happened to free them.
jemalloc-bg-thread yes
