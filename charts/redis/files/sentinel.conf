# =============================================================================
# Redis Sentinel — configuration of the sentinel process
# =============================================================================
#
# The sidecar's own configuration, distinct from the Redis servers it watches
# (those read files/redis.conf + files/mode-sentinel.conf).
#
# Rendered with `tpl`, so {{ .Values.sentinel.masterSet }} below resolves to the
# name you set in values.yaml. Every `sentinel <directive> <master-name>` line
# must name the monitored master, which is why they are templated rather than
# hardcoded.
#
# ORDER MATTERS HERE, more than anywhere else in this chart. `sentinel monitor`
# declares the master; every other line referring to it must come after, or
# sentinel refuses to start with "No such master with specified name". The chart
# therefore prepends the monitor line — it is the one directive it must compute
# at startup, since which pod currently leads is not known at render time — and
# this file is concatenated after it.
#
# Sentinel REWRITES the file it was started with, as it learns the topology. The
# chart gives it a copy on a writable emptyDir for that reason: the rewrite is
# scratch state, rebuilt from the live topology on every start, and the source
# of truth stays the ConfigMap.
#
# Reference: https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/
# =============================================================================

# -----------------------------------------------------------------------------
# ADDRESSING
# -----------------------------------------------------------------------------
#
# The two lines that make sentinel usable on Kubernetes.
#
# Sentinel identifies instances by address and gossips those addresses to the
# other sentinels and to every sentinel-aware client. Left to itself it uses IP
# addresses, and a pod IP outlives neither a reschedule nor a rolling update:
# sentinel then reports a master at an address that now belongs to something
# else, and clients dutifully connect to it.
#
# `resolve-hostnames` lets sentinel accept a DNS name where it expects an
# address — that is what allows the monitor line to name a pod rather than an IP
# — and `announce-hostnames` makes it hand those names back out instead of the
# addresses they resolved to.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# The address this sentinel announces for itself is set by the chart to the
# pod's own DNS name, for the same reason.

# -----------------------------------------------------------------------------
# FAILURE DETECTION AND FAILOVER
# -----------------------------------------------------------------------------

# How long the master must be unresponsive before this sentinel calls it down,
# in milliseconds. Only a quorum of sentinels agreeing turns that into a real
# failover.
#
# 10s, not the 30s Redis ships with: a pod that stops answering has usually
# stopped for good — killed, evicted, OOM — and there is little point waiting
# half a minute to find out. Going much lower is a bad trade, since a GC pause,
# a slow fsync on network storage or a busy node all look exactly like death for
# a second or two.
sentinel down-after-milliseconds {{ .Values.sentinel.masterSet }} 10000

# Number of replicas reconfigured to follow the new master at the same time.
# Each one costs a resync from the promoted node, so 1 keeps the promotion cheap
# and lets the replicas come back one after another instead of all at once.
sentinel parallel-syncs {{ .Values.sentinel.masterSet }} 1

# Bound on a failover attempt before another sentinel may start its own, in
# milliseconds. It gates retries, so a value under down-after-milliseconds makes
# sentinels trip over each other's attempts.
sentinel failover-timeout {{ .Values.sentinel.masterSet }} 60000

# Refuse to let the notification and reconfiguration scripts below be changed at
# runtime through SENTINEL SET. Anything able to talk to sentinel could
# otherwise point them at a binary of its choosing and have every sentinel run
# it on the next event.
sentinel deny-scripts-reconfig yes

# -----------------------------------------------------------------------------
# NOTIFICATION HOOKS
# -----------------------------------------------------------------------------
#
# Sentinel can run a script on every event, and another when a failover starts.
# Both must exist inside the sentinel container — mount them through
# extraFiles.configMap with a mode that makes them executable.
#
# sentinel notification-script {{ .Values.sentinel.masterSet }} /etc/redis/files/notify.sh
# sentinel client-reconfig-script {{ .Values.sentinel.masterSet }} /etc/redis/files/reconfig.sh

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logfile ""
loglevel notice
