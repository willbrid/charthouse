# =============================================================================
# Redis OSS — minimal configuration of the SENTINEL mode (server side)
# =============================================================================
#
# Concatenated after files/redis.conf when mode is "sentinel". This is the
# configuration of the Redis servers that sentinel watches over, not of sentinel
# itself — that one is files/sentinel.conf.
#
# What the chart owns and you will not find here:
#   replicaof              decided at startup by asking sentinel who leads
#   replica-announce-ip    the pod's own DNS name, known at startup only
#   dir                    the volume mount path
#
# Reference: https://redis.io/docs/latest/operate/oss_and_stack/management/sentinel/
# =============================================================================

# -----------------------------------------------------------------------------
# ADDRESSING
# -----------------------------------------------------------------------------
#
# Same problem as in cluster mode, in a smaller place. Sentinel discovers the
# replicas of a master by reading `INFO replication` on that master, which
# reports each replica by the address it announced. Announcing a pod IP means
# sentinel remembers an address that a reschedule invalidates, and then promotes
# or reconfigures something that is no longer there.
#
# The chart sets replica-announce-ip to the pod's stable DNS name at startup,
# and sentinel is told to resolve and to announce hostnames — see
# files/sentinel.conf. The announced port is the plain service port, which the
# chart also sets.

# -----------------------------------------------------------------------------
# FAILOVER BEHAVIOUR
# -----------------------------------------------------------------------------

# A replica must accept the writes sentinel replicates to it, and must refuse
# everything else. Sentinel turns this off by itself on the node it promotes;
# nothing else should ever turn it off.
replica-read-only yes

# Keep answering reads from a replica whose master is unreachable. During a
# failover this is the difference between degraded reads and no reads at all.
replica-serve-stale-data yes

# All pods carry the same weight in an election. A replica with priority 0 can
# never be promoted, which is how a node is deliberately kept out — useful for
# an instance dedicated to backups or to analytics reads, and pointless for a
# set of identical pods.
replica-priority 100

# -----------------------------------------------------------------------------
# PERSISTENCE AND FAILOVER, TOGETHER
# -----------------------------------------------------------------------------
#
# A restarted master that comes back empty is the classic way to lose a whole
# dataset with sentinel: it is still the master, its replicas resync from it,
# and they faithfully copy the emptiness. The chart's defaults are what keep
# that from happening — AOF is on and the data directory is a PersistentVolume,
# so a restarted pod comes back with its data.
#
# Turning persistence off in values.yaml turns this back into a real risk. If
# you must run without a volume, run without a master that can restart in place:
# let sentinel promote a replica instead.

# -----------------------------------------------------------------------------
# WRITE SAFETY (opt-in)
# -----------------------------------------------------------------------------
#
# Sentinel promotes on a majority of *sentinels*, not on a majority of data. A
# master partitioned away from the sentinels keeps accepting writes from any
# client that can still reach it, right up to the moment it is demoted — and
# those writes are then discarded.
#
# These two lines are the only defence Redis offers: the master refuses writes
# unless at least one replica is connected and lagging under ten seconds. Off by
# default, because it makes a replica outage into a write outage. Turn it on
# when a lost acknowledged write costs more than a refused one.
# min-replicas-to-write 1
# min-replicas-max-lag 10
