# =============================================================================
# Redis OSS — minimal configuration of the CLUSTER mode
# =============================================================================
#
# Concatenated after files/redis.conf when mode is "cluster". Overrides
# whatever the base file said, and is itself overridden by config.overrides and
# by the directives the chart generates per pod.
#
# What the chart owns and you will not find here:
#   cluster-enabled            always yes in this mode
#   cluster-config-file        must live on the volume, next to the data
#   cluster-announce-hostname  the pod's own DNS name, known at startup only
#   dir                        the volume mount path
#
# Reference: https://redis.io/docs/latest/operate/oss_and_stack/management/scaling/
# =============================================================================

# -----------------------------------------------------------------------------
# ADDRESSING — the part that makes or breaks a cluster on Kubernetes
# -----------------------------------------------------------------------------
#
# A Redis Cluster is not behind a proxy: every node hands the client the address
# of whichever node owns the slot, and the client connects there directly. So
# the addresses the nodes gossip about each other are the addresses your clients
# will dial, and a pod IP is not one of them — it changes on every reschedule,
# and the client that cached it is talking to whatever took the address next.
#
# Announcing hostnames instead is what fixes this. Each pod announces its stable
# per-pod DNS name (set by the chart from the headless service), and this line
# is what makes the cluster hand that name to clients rather than the IP behind
# it. Without it the announced hostname is gossiped and then ignored.
cluster-preferred-endpoint-type hostname

# -----------------------------------------------------------------------------
# FAILURE DETECTION
# -----------------------------------------------------------------------------
#
# How long a node may be unreachable before its peers agree it is down, in
# milliseconds. The Redis default of 15s is a good fit here and deliberately not
# lowered: a node that is merely slow — a full AOF rewrite, a noisy neighbour, a
# CNI hiccup during a rolling update — must not be voted out, because the
# failover that follows costs far more than the pause that triggered it.
cluster-node-timeout 15000

# A replica whose link to its master has been down for longer than
# cluster-node-timeout * this factor refuses to be promoted. It guards against
# a very stale replica taking over: 10 * 15s means a replica out of touch for
# more than 150 seconds stays out of the election.
cluster-replica-validity-factor 10

# Keep serving the slots that are still covered when part of the cluster is
# unreachable. `yes` — the Redis default — takes the whole cluster down as soon
# as a single slot has no owner, which on Kubernetes means a rolling update of
# one shard stops the other shards too.
#
# The trade is real and worth stating: with `no`, a client asking for a key in a
# missing slot gets an error while the rest keeps working. With `yes`, everyone
# gets an error. Neither one makes the missing slot available.
cluster-require-full-coverage no

# Let a replica migrate to a master that has none left, so the cluster heals its
# own redundancy instead of waiting for an operator.
cluster-allow-replica-migration yes

# Never leave a master without a replica in order to give another one a second.
# 1 is the Redis default and the right value for any cluster with one replica
# per master.
cluster-migration-barrier 1

# -----------------------------------------------------------------------------
# CLUSTER MODE CONSTRAINTS
# -----------------------------------------------------------------------------

# Redis Cluster supports database 0 only. Stated explicitly so that a base file
# carrying `databases 16` does not leave the impression that SELECT works here.
databases 1

# The cluster bus listens on the client port + 10000 (16379 by default) and must
# be reachable between pods — it is the port the nodes gossip and fail over on.
# Setting cluster-port moves it, which the chart's service and NetworkPolicy
# examples do not expect; leave it alone unless you adjust those too.
