{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "redis.serviceAccountName" . }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /* Nothing in this chart talks to the API server: the pods find each other
       through DNS, and the bootstrap job through DNS too. A token mounted here
       would be a credential with no purpose and a blast radius. */}}
automountServiceAccountToken: {{ .Values.serviceAccount.automount | default false }}
{{- end }}
