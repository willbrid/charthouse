{{- /*
Same as configmap-files.yaml, for the files that should not sit in a ConfigMap:
TLS keys, credentials, anything an unprivileged reader of the namespace has no
business seeing. Both land in the same directory inside the container.
*/ -}}
{{- with (.Values.extraFiles | default dict).secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "redis.fullname" $ }}-files
  labels:
    {{- include "redis.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $content := . }}
  {{ $name }}: |
    {{- tpl $content $ | nindent 4 }}
  {{- end }}
{{- end }}
