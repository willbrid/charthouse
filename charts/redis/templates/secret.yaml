{{- $auth := .Values.auth | default dict -}}
{{- if and $auth.enabled (not $auth.existingSecret) }}
{{- $name := include "redis.fullname" . -}}
{{- $key := include "redis.secretPasswordKey" . -}}
{{- $password := $auth.password -}}
{{- if not $password -}}
{{- /* No password given, so one is generated. `lookup` reads the Secret already
       in the cluster and keeps its value: without this, every `helm upgrade`
       would mint a new password, the pods would restart with it one by one, and
       for the length of the rollout half the set would reject the other half —
       replicas unable to authenticate to their master, sentinels unable to
       reach anything. `lookup` returns nothing during a dry run or a
       `helm template`, which is why the fallback below is unconditional. */ -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- if and $existing $existing.data (index $existing.data $key) -}}
{{- $password = index $existing.data $key | b64dec -}}
{{- else -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "redis.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
{{- end }}
