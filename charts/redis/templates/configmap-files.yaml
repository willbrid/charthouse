{{- /*
User-provided files that are not sensitive: an ACL file, a sentinel hook, a Lua
script. Rendered with `tpl`, so a file may refer to values — the release name,
the master set, a generated password.
*/ -}}
{{- with (.Values.extraFiles | default dict).configMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "redis.fullname" $ }}-files
  labels:
    {{- include "redis.labels" $ | nindent 4 }}
data:
  {{- range $name, $content := . }}
  {{ $name }}: |
    {{- tpl $content $ | nindent 4 }}
  {{- end }}
{{- end }}
