# Default values for otelcollector.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: otel/opentelemetry-collector-contrib
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: "otelcollector"
fullnameOverride: "otelcollector"

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  # Each entry drives both the service port and the matching container port of the deployment:
  #   name       (required) port name, unique, 15 characters max (Kubernetes constraint).
  #   port       (required) port exposed by the service.
  #   targetPort (optional) port exposed by the container, defaults to the port name,
  #              which resolves to `port` on the container side.
  #   protocol   (optional) TCP (default) or UDP.
  # The first entry is used as backend by the ingress and the HTTPRoute.
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
    # Extra receivers/extensions of the collector, to enable together with the matching
    # collector configuration:
    # - name: metrics
    #   port: 8888
    #   targetPort: 8888
    #   protocol: TCP
    # - name: zpages
    #   port: 55679
    #   targetPort: 55679
    #   protocol: TCP
    # - name: zipkin
    #   port: 9411
    #   targetPort: 9411
    #   protocol: TCP

# Sensitive collector environment variables injected into the pod via a Kubernetes Secret
# mounted with `envFrom`.
# Each key-value pair is automatically base64-encoded and exposed as an env var inside the container.
# Use this section for credentials and other confidential configuration (exporter API keys,
# basic auth passwords, TLS passphrases, etc.).
# The Secret is only created when this section is not empty.
secret: {}
  #  OTLP_EXPORTER_API_KEY: "changeme"
  #  BASIC_AUTH_PASSWORD: "test@test"

# Non-sensitive collector environment variables injected into the pod via a Kubernetes ConfigMap
# mounted with `envFrom`.
# Each key-value pair is stored in plain text and exposed as an env var inside the container.
# Use this section for endpoints, resource attributes, memory limits, and other non-confidential
# configuration that can safely be stored unencrypted.
# The ConfigMap is only created when this section is not empty.
configmap: {}
  #  GOMEMLIMIT: "400MiB"
  #  OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=production"

# In addition to the two sections above, the deployment always injects the environment
# variable OTEL_COLLECTOR_POD_IP, filled with the pod IP through the downward API
# (fieldRef on status.podIP). It is meant to be referenced from the collector configuration
# as ${env:OTEL_COLLECTOR_POD_IP}, typically to bind the receivers to the pod address
# (${env:OTEL_COLLECTOR_POD_IP}:4317) rather than to 0.0.0.0, which the collector reports
# as an insecure default, while keeping them reachable from the other pods of the cluster.
# This variable is managed by the chart and cannot be overridden from the values.

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  # Backend port used by the paths which do not declare their own `port`.
  # Name (otlp-http, ...) or number (4318, ...) of a `service.ports` entry.
  # When left empty, the first entry of `service.ports` is used.
  port: ""
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          # Backend port for this path only, name or number of a `service.ports` entry.
          # port: otlp-http
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# -- Expose the service via gateway-api HTTPRoute
# Requires Gateway API resources and suitable controller installed within the cluster
# (see: https://gateway-api.sigs.k8s.io/guides/)
httpRoute:
  # HTTPRoute enabled.
  enabled: false
  # HTTPRoute annotations.
  annotations: {}
  # Which Gateways this Route is attached to.
  parentRefs:
  - name: gateway
    sectionName: http
    # namespace: default
  # Hostnames matching HTTP header.
  hostnames:
  - chart-example.local
  # Backend port used by the rules which do not declare their own `port`.
  # Name (otlp-http, ...) or number (4318, ...) of a `service.ports` entry.
  # When left empty, the first entry of `service.ports` is used.
  port: ""
  # List of rules and filters applied.
  # Each rule accepts an optional `port` (backend port, name or number of a
  # `service.ports` entry) and an optional `weight` (defaults to 1).
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /headers
  #   port: otlp-http
  #   weight: 1
  #   filters:
  #   - type: RequestHeaderModifier
  #     requestHeaderModifier:
  #       set:
  #       - name: My-Overwrite-Header
  #         value: this-is-the-only-value
  #       remove:
  #       - User-Agent
  # - matches:
  #   - path:
  #       type: PathPrefix
  #       value: /echo
  #     headers:
  #     - name: version
  #       value: v2

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# The `port` value references a port name declared in `service.ports`.
livenessProbe:
  httpGet:
    path: /
    port: health
readinessProbe:
  httpGet:
    path: /
    port: health

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}
