{{- $config := "" -}}
{{- if kindIs "string" .Values.config -}}
{{- $config = .Values.config -}}
{{- else -}}
{{- $config = toYaml .Values.config -}}
{{- end -}}
{{- if not (trim $config) -}}
{{- fail "otelcollector: config must hold the collector configuration, either inline or through --set-file config=<file>" -}}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "otelcollector.fullname" . }}-config
  labels:
    {{- include "otelcollector.labels" . | nindent 4 }}
data:
  otel-collector-config.yaml: |
    {{- tpl $config . | nindent 4 }}
