# CI test values for the OpenTelemetry Collector chart — multi-port scenario.
# Used by chart-testing (ct) to validate that additional service ports are
# published, that the matching container ports are declared, and that the
# ingress backends can select a port by name as well as by number.

image:
  repository: otel/opentelemetry-collector-contrib
  pullPolicy: IfNotPresent
  tag: "0.157.0"

command:
  - "/otelcol-contrib"

# Four ports exposed, including a NodePort assignment to validate that the
# nodePort field is only rendered for NodePort/LoadBalancer services.
service:
  type: NodePort
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
      nodePort: 31318
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: health
      port: 13133
      targetPort: 13133
      protocol: TCP
    - name: zpages
      port: 55679
      targetPort: 55679
      protocol: TCP

# Collector configuration matching the four ports above: OTLP receivers, the
# health_check extension used by the probes and the helm test hook, and the
# zpages extension backing the extra port.
config: |
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: ${env:OTEL_COLLECTOR_POD_IP}:4317
        http:
          endpoint: ${env:OTEL_COLLECTOR_POD_IP}:4318

  processors:
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
    batch: {}

  exporters:
    debug:
      verbosity: basic

  extensions:
    health_check:
      endpoint: ${env:OTEL_COLLECTOR_POD_IP}:13133
    zpages:
      endpoint: ${env:OTEL_COLLECTOR_POD_IP}:55679

  service:
    extensions: [health_check, zpages]
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      metrics:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]
      logs:
        receivers: [otlp]
        processors: [memory_limiter, batch]
        exporters: [debug]

# Ingress enabled with one backend port selected by name and another one by
# number, on top of the chart-wide default. No ingress controller is required
# for `ct install`: only the creation of the resource is validated.
ingress:
  enabled: true
  className: ""
  annotations: {}
  port: otlp-http
  hosts:
    - host: otelcollector.ci.local
      paths:
        - path: /v1/traces
          pathType: Prefix
          port: otlp-http
        - path: /debug
          pathType: Prefix
          port: 55679
        - path: /
          pathType: Prefix
  tls: []

# HTTPRoute disabled: it would require the Gateway API CRDs and a controller
# in the test cluster.
httpRoute:
  enabled: false

autoscaling:
  enabled: false

replicaCount: 1

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

livenessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: health
  initialDelaySeconds: 15
  periodSeconds: 10
