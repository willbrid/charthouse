apiVersion: v2
name: kafka
description: A Helm chart for installing Apache Kafka in KRaft mode in Kubernetes
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.1.0

# Version of Apache Kafka deployed by the chart, used as the default image tag.
# 4.2.0 is the floor for the dynamic controller quorum the chart uses by default:
# a controller formatted without an initial voter set joins the quorum on its own
# through controller.quorum.auto.join.enable, which does not exist before 4.2 —
# on 4.1 the property is silently ignored and the extra nodes stay observers.
# Earlier releases, down to 4.0.0 where ZooKeeper was removed, need
# kraft.quorum.mode: static.
appVersion: "4.2.0"

keywords:
  - kafka
  - kraft
  - streaming
  - messaging

home: https://kafka.apache.org
sources:
  - https://github.com/apache/kafka
  - https://hub.docker.com/r/apache/kafka

# Chart maintainers — required by chart-testing (ct lint) conventions.
maintainers:
  - name: willbrid
    email: ngaswilly77@gmail.com

annotations:
  # Keeps the chart out of the release pipeline while it is under development:
  # it is still linted and installed by the test suite, but never packaged nor
  # pushed to GHCR. Remove this annotation (or set it to "true") to publish the
  # first version.
  charthouse.io/release: "true"
