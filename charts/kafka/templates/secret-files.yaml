{{- with (.Values.extraFiles | default dict).secret -}}
{{- /*
Sensitive files injected into the container, mounted read-only alongside the ones
coming from the ConfigMap, in the same extraFiles.mountPath. This is where a JAAS
configuration belongs — it carries passwords in clear text — and where the
apache/kafka image expects the SSL material, since it derives the path of the
keystore and truststore from /etc/kafka/secrets.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.fullname" $ }}-files
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $name, $content := . }}
  {{ $name }}: |
    {{- tpl $content $ | nindent 4 }}
  {{- end }}
{{- end }}
