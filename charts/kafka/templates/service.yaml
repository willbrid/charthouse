{{- if include "kafka.isBroker" . -}}
{{- /*
The bootstrap address: one name for bootstrap.servers, load-balanced over the pods.
A client only uses it for the first exchange — it then learns which broker leads
which partition and dials that broker directly, on the per-pod address the headless
service provides. Which is why this service carries the broker listeners only, and
why a controller-only release has none at all: it has nothing to bootstrap.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kafka.fullname" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- $nodePorts := .Values.service.nodePorts | default dict }}
    {{- range (include "kafka.brokerListeners" . | fromYamlArray) }}
    - name: {{ .name | lower }}
      port: {{ .port }}
      targetPort: {{ .name | lower }}
      protocol: TCP
      {{- with (get $nodePorts .name) }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "kafka.selectorLabels" . | nindent 4 }}
{{- end }}
