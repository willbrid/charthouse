{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kafka.serviceAccountName" . }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Kafka never calls the Kubernetes API: it discovers its peers through DNS and its
# own identity through the downward API. Mounting a token would hand the pods a
# credential they have no use for.
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
