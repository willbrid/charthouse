{{- with .Values.configmap -}}
{{- /*
Non-sensitive environment variables, mounted with envFrom. Note that the variables
the chart generates are declared as explicit `env` entries, which take precedence
over envFrom: this is a place for extra variables, not a way to override a
generated Kafka property. Use `config` for that.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kafka.fullname" $ }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
data:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
