{{- with .Values.secret -}}
{{- /*
Sensitive environment variables, mounted with envFrom: keystore passwords, SASL
credentials, anything that must not appear in a ConfigMap.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kafka.fullname" $ }}
  labels:
    {{- include "kafka.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
