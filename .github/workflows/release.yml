name: Release Charts

on:
  # Triggers only when a Chart.yaml is modified on main, which signals a version bump.
  # A non-Chart.yaml change (templates, values, README…) runs lint-test but not release.
  push:
    branches:
      - main
    paths:
      - 'charts/**/Chart.yaml'
  # Enables manual re-triggering from the GitHub Actions UI after a bug fix
  # that did not require a version bump (e.g. fixing a pipeline configuration).
  workflow_dispatch:
    inputs:
      charts:
        description: 'Charts to release, comma-separated (e.g. fluentbit,grafana). Empty releases every chart.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  # Run the lint + Kind-based install suite before publishing.
  # The called workflow inherits the github context of this one, so on a push it
  # detects the changed charts from the very same before/sha diff the release step
  # below relies on: what gets tested is what gets published, nothing else.
  # A workflow_dispatch run has no such diff: either the operator named the charts
  # and both jobs use that selection, or every chart is tested and published.
  lint-test:
    name: Lint and Test
    uses: ./.github/workflows/lint-test.yml
    with:
      run_all: ${{ github.event_name == 'workflow_dispatch' && inputs.charts == '' }}
      charts: ${{ inputs.charts }}

  release:
    name: Package and Publish to GHCR
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      # Installs the cr CLI only; packaging and uploading are handled manually
      # below so charts are pushed to GHCR via OCI instead of GitHub Releases.
      - name: Install chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          install_only: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Detect charts to release
        id: detect
        env:
          # Run-controlled values are read through the environment rather than
          # interpolated into the script body.
          CHARTS_INPUT: ${{ inputs.charts }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          if [ -n "$CHARTS_INPUT" ]; then
            # Explicit selection of a manual run, resolved by the same script the
            # test suite used, so both jobs agree on what this run is about. An
            # unknown chart stops the run instead of silently publishing nothing.
            candidates=$(.github/scripts/resolve-charts.sh "$CHARTS_INPUT") || exit 1
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] || \
               [ "$PUSH_BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # Manual run with no selection has no before/after SHA; process all charts.
            # First push to the branch also has a zeroed before SHA: same fallback.
            candidates=$(find charts -mindepth 1 -maxdepth 1 -type d | sort)
          else
            # Only the charts whose Chart.yaml changed are candidates, which mirrors the
            # `paths` filter of this workflow: a version bump is the release signal. A push
            # touching the templates or the values of another chart must not publish it as
            # a side effect of someone else's version bump.
            candidates=$(
              git diff --name-only "$PUSH_BEFORE" "$PUSH_SHA" \
                | grep -E '^charts/[^/]+/Chart\.yaml$' \
                | cut -d/ -f1-2 \
                | sort -u
            )
          fi

          # Charts opting out of publication carry `charthouse.io/release: "false"` in the
          # annotations of their Chart.yaml. Used by charts still under development: they
          # are linted and installed by the test suite, but never pushed to the registry.
          charts=""
          for chart in $candidates; do
            release=$(yq -r '.annotations."charthouse.io/release" // "true"' "$chart/Chart.yaml")
            if [ "$release" = "false" ]; then
              echo "::notice::Skipping $chart: annotation charthouse.io/release is \"false\""
              continue
            fi
            charts=$(printf '%s\n%s' "$charts" "$chart" | sed '/^$/d')
          done

          if [ -n "$charts" ]; then
            echo "has_charts=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_charts=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "charts<<CHARTS_EOF"
            echo "$charts"
            echo "CHARTS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Package changed charts with chart-releaser
        if: steps.detect.outputs.has_charts == 'true'
        run: |
          while IFS= read -r chart; do
            [ -z "$chart" ] && continue
            echo "==> Packaging: $chart"
            cr package "$chart"
          done <<< "${{ steps.detect.outputs.charts }}"

      - name: Login to GitHub Container Registry
        if: steps.detect.outputs.has_charts == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # Pushes each packaged chart as an OCI artifact to:
      # oci://ghcr.io/<owner>/charts/<chart-name>:<chart-version>
      # Pull command: helm pull oci://ghcr.io/<owner>/charts/<chart-name> --version <version>
      - name: Push charts to GHCR via OCI
        if: steps.detect.outputs.has_charts == 'true'
        run: |
          for pkg in .cr-release-packages/*.tgz; do
            [ -f "$pkg" ] || continue
            echo "==> Pushing: $pkg"
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
