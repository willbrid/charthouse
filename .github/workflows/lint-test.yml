name: Lint and Test Charts

on:
  # Validates only the charts modified by the PR.
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
  # Runs on every push to main that touches charts/**, and validates only the
  # charts the push actually modified (see the detect job).
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '!charts/**/Chart.yaml'
  # Allows release.yml to call this workflow with run_all: true,
  # bypassing change detection: a release validates the whole repository.
  workflow_call:
    inputs:
      run_all:
        description: 'Run lint and install on all charts, bypassing change detection'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Single source of truth for "which charts does this run cover?", so that the
  # lint and install jobs can never disagree on the answer.
  detect:
    name: Detect charts to test
    runs-on: ubuntu-latest
    outputs:
      # Newline-separated chart directories, for the steps iterating over them.
      charts: ${{ steps.detect.outputs.charts }}
      # Selection flags handed over to ct, which takes a comma-separated list.
      ct_flags: ${{ steps.detect.outputs.ct_flags }}
      run_ct: ${{ steps.detect.outputs.run_ct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required to diff against the push base or the target branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Detect charts to test
        id: detect
        run: |
          if [ "${{ inputs.run_all }}" = "true" ]; then
            # Called by release.yml: everything is validated before publishing.
            charts=$(find charts -mindepth 1 -maxdepth 1 -type d | sort)
            flags="--all"
          elif [ "${{ github.event_name }}" = "push" ]; then
            # On main, `ct list-changed` has nothing to diff against: the target
            # branch is the branch we are on. The push payload carries the base
            # commit instead, which is the same diff release.yml relies on.
            before="${{ github.event.before }}"
            if [ -z "$before" ] \
               || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              # First push on the branch, or history rewritten by a force-push:
              # the base commit is unusable, fall back to the whole repository.
              echo "::notice::Unusable push base ${before}, testing every chart"
              charts=$(find charts -mindepth 1 -maxdepth 1 -type d | sort)
              flags="--all"
            else
              # A chart directory deleted by the push still shows up in the diff;
              # keep only the ones that exist, ct cannot test a removed chart.
              charts=$(
                git diff --name-only "$before" "${{ github.sha }}" \
                  | grep -E '^charts/[^/]+/' \
                  | cut -d/ -f1-2 \
                  | sort -u \
                  | while IFS= read -r chart; do
                      [ -d "$chart" ] && echo "$chart"
                    done
              )
              flags=""
            fi
          else
            # Pull request: ct computes the diff against the target branch itself.
            charts=$(ct list-changed --target-branch main)
            flags="--target-branch main"
          fi

          if [ -z "$charts" ]; then
            echo "::notice::No chart to test"
            echo "run_ct=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_ct=true" >> "$GITHUB_OUTPUT"
            echo "==> Charts to test:"
            echo "$charts"
          fi

          # An explicit --charts list is what keeps a push from testing charts it
          # never touched; --all and --target-branch drive the selection themselves.
          if [ -z "$flags" ] && [ -n "$charts" ]; then
            flags="--charts $(echo "$charts" | paste -sd, -)"
          fi
          echo "ct_flags=$flags" >> "$GITHUB_OUTPUT"

          {
            echo "charts<<CHARTS_EOF"
            echo "$charts"
            echo "CHARTS_EOF"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_ct == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for ct to compute the diff against target-branch.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (lint)
        run: ct lint ${{ needs.detect.outputs.ct_flags }}

      - name: Run helm template on changed charts
        run: |
          while IFS= read -r chart; do
            [ -z "$chart" ] && continue
            echo "==> helm template: $chart"
            helm template ci-test "$chart"
          done <<< "${{ needs.detect.outputs.charts }}"

  install:
    name: Install in Kind
    runs-on: ubuntu-latest
    needs: [detect, lint]
    if: needs.detect.outputs.run_ct == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # Kind (v0.11+) automatically provisions a "standard" StorageClass backed
      # by rancher/local-path-provisioner. No extra StorageClass setup is needed.
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chart-testing

      - name: Verify standard StorageClass is available
        run: |
          echo "==> Available StorageClasses:"
          kubectl get storageclass
          kubectl get storageclass standard

      - name: Run chart-testing (install)
        run: ct install ${{ needs.detect.outputs.ct_flags }}
