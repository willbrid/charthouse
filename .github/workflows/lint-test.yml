name: Lint and Test Charts

on:
  # Validates only the charts modified by the PR.
  # A README carries no template and no value: there is nothing for ct to lint or
  # install, so documentation-only changes never start a run.
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - '!charts/**/README.md'
  # Runs on every push to main that touches charts/**, and validates only the
  # charts the push actually modified (see the detect job).
  push:
    branches:
      - main
    paths:
      - 'charts/**'
      - '!charts/**/Chart.yaml'
      - '!charts/**/README.md'
  # Called by release.yml before publishing. The github context is inherited from
  # the caller, so a release triggered by a push detects its charts from the same
  # diff as any other push: run_all is only set for a manual workflow_dispatch,
  # which has no diff to work from and processes the whole repository.
  workflow_call:
    inputs:
      run_all:
        description: 'Run lint and install on all charts, bypassing change detection'
        type: boolean
        default: false
      charts:
        description: 'Comma-separated charts to test, overriding change detection'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  # Single source of truth for "which charts does this run cover?", so that the
  # lint and install jobs can never disagree on the answer.
  detect:
    name: Detect charts to test
    runs-on: ubuntu-latest
    outputs:
      # Newline-separated chart directories, for the steps iterating over them.
      charts: ${{ steps.detect.outputs.charts }}
      # Selection flags handed over to ct, which takes a comma-separated list.
      ct_flags: ${{ steps.detect.outputs.ct_flags }}
      run_ct: ${{ steps.detect.outputs.run_ct }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required to diff against the push base or the target branch.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Detect charts to test
        id: detect
        env:
          # Run-controlled values are read through the environment rather than
          # interpolated into the script body.
          RUN_ALL: ${{ inputs.run_all }}
          CHARTS_INPUT: ${{ inputs.charts }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          # Chart directories touched by a diff, documentation excluded. A README
          # is packaged with the chart but holds nothing ct can lint or install,
          # so a chart whose only change is its README stays out of the selection.
          # Same pattern as the `!charts/**/README.md` path filter above, which
          # already keeps a purely documentary push from starting a run at all;
          # this handles the mixed push, where another chart did change too.
          changed_chart_dirs() {
            git diff --name-only "$@" \
              | grep -E '^charts/[^/]+/' \
              | grep -vE '/README\.md$' \
              | cut -d/ -f1-2 \
              | sort -u \
              | while IFS= read -r chart; do
                  # A chart directory deleted by the diff still shows up in it;
                  # keep only the ones that exist, ct cannot test a removed chart.
                  [ -d "$chart" ] && echo "$chart"
                done
          }

          if [ -n "$CHARTS_INPUT" ]; then
            # Explicit selection handed over by a manual release run. The exit
            # status is checked rather than left to `set -e`: an unknown chart
            # must stop the run, never be read as an empty selection, which would
            # report success while testing nothing.
            charts=$(.github/scripts/resolve-charts.sh "$CHARTS_INPUT") || exit 1
            flags=""
          elif [ "$RUN_ALL" = "true" ]; then
            # Manual release run with no selection: everything is validated.
            charts=$(find charts -mindepth 1 -maxdepth 1 -type d | sort)
            flags="--all"
          elif [ "$EVENT_NAME" = "push" ]; then
            # On main, `ct list-changed` has nothing to diff against: the target
            # branch is the branch we are on. The push payload carries the base
            # commit instead, which is the same diff release.yml relies on.
            before="$PUSH_BEFORE"
            if [ -z "$before" ] \
               || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              # First push on the branch, or history rewritten by a force-push:
              # the base commit is unusable, fall back to the whole repository.
              echo "::notice::Unusable push base ${before}, testing every chart"
              charts=$(find charts -mindepth 1 -maxdepth 1 -type d | sort)
              flags="--all"
            else
              charts=$(changed_chart_dirs "$before" "$PUSH_SHA")
              flags=""
            fi
          else
            # Pull request: ct computes the diff against the target branch itself,
            # which is also what makes its version-increment check work. Charts whose
            # only change is documentation are therefore not removed from its list but
            # handed over as exclusions, so that check keeps running on the others.
            listed=$(ct list-changed --target-branch main) || exit 1
            charts=""
            excluded=""
            for chart in $listed; do
              # A chart is dropped only once its own diff is seen and holds nothing
              # but READMEs. Should the diff be unavailable, the chart is kept: this
              # filter may only ever test less than asked, never skip silently.
              files=$(git diff --name-only "origin/main...HEAD" -- "$chart") || files=""
              if [ -n "$files" ] && ! echo "$files" | grep -qvE '/README\.md$'; then
                echo "::notice::Skipping $chart: documentation-only change"
                excluded=$(printf '%s,%s' "$excluded" "$(basename "$chart")")
              else
                charts=$(printf '%s\n%s' "$charts" "$chart")
              fi
            done
            charts=$(echo "$charts" | sed '/^$/d')
            flags="--target-branch main"
            if [ -n "$excluded" ]; then
              flags="$flags --excluded-charts ${excluded#,}"
            fi
          fi

          if [ -z "$charts" ]; then
            echo "::notice::No chart to test"
            echo "run_ct=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_ct=true" >> "$GITHUB_OUTPUT"
            echo "==> Charts to test:"
            echo "$charts"
          fi

          # An explicit --charts list is what keeps a push from testing charts it
          # never touched; --all and --target-branch drive the selection themselves.
          if [ -z "$flags" ] && [ -n "$charts" ]; then
            flags="--charts $(echo "$charts" | paste -sd, -)"
          fi
          echo "ct_flags=$flags" >> "$GITHUB_OUTPUT"

          {
            echo "charts<<CHARTS_EOF"
            echo "$charts"
            echo "CHARTS_EOF"
          } >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.run_ct == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history required for ct to compute the diff against target-branch.
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (lint)
        run: ct lint ${{ needs.detect.outputs.ct_flags }}

      - name: Run helm template on changed charts
        run: |
          while IFS= read -r chart; do
            [ -z "$chart" ] && continue
            echo "==> helm template: $chart"
            helm template ci-test "$chart"
          done <<< "${{ needs.detect.outputs.charts }}"

  install:
    name: Install in Kind
    runs-on: ubuntu-latest
    needs: [detect, lint]
    if: needs.detect.outputs.run_ct == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      # Kind (v0.11+) automatically provisions a "standard" StorageClass backed
      # by rancher/local-path-provisioner. No extra StorageClass setup is needed.
      - name: Create Kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: chart-testing

      - name: Verify standard StorageClass is available
        run: |
          echo "==> Available StorageClasses:"
          kubectl get storageclass
          kubectl get storageclass standard

      - name: Run chart-testing (install)
        run: ct install ${{ needs.detect.outputs.ct_flags }}
